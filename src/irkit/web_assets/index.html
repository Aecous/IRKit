<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRKit · Agent 工作台</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><div class="brand">IR<span>Kit</span><small>AGENT WORKSPACE</small></div><div id="case"></div><div id="connection">正在连接</div><button id="new-job" class="primary">＋ 下发调查任务</button></header>
<div class="projectbar"><label>分析项目 <select id="project-select" aria-label="分析项目"></select></label><button id="create-project" class="small">＋ 新建项目</button><button id="manage-project" class="small">项目设置</button><button id="trash-button" class="small">回收站</button></div>
<div class="runbar"><label>调查 <select id="investigation-select" aria-label="调查"></select></label><button id="history-button" class="small">调查与运行记录</button><label>会话 <select id="session" aria-label="调查会话"></select></label><span id="session-status"></span><div id="metrics"></div></div>
<div id="jobs" class="job-strip" aria-live="polite"></div>
<main><aside class="agents-panel"><div class="section-title">调查参与者 <span id="agent-count"></span></div><button id="all-agents" class="all selected">全部 Agent</button><div id="agents"></div><details class="task-history"><summary>案件任务历史 <span id="task-count"></span></summary><div id="tasks"></div></details></aside>
<section class="center"><div id="run-overview" role="status"></div><div class="toolbar"><nav aria-label="查看内容"><button data-tab="run" class="active">会话过程</button><button data-tab="cards">事件卡片</button><button data-tab="sources">来源行为</button><button data-tab="reports">报告</button></nav><button id="toggle-detail" class="small" aria-expanded="false">证据面板</button><input id="search" aria-label="搜索当前视图" placeholder="搜索消息、事件或资产"></div><div class="conversation-bar"><span id="view-context">Claude 原生会话</span><select id="message-filter" aria-label="消息类型"><option value="all">全部消息</option><option value="text">分析与结论</option><option value="tool">工具调用</option><option value="error">错误与中断</option></select><label id="follow-label"><input type="checkbox" id="follow" checked> 跟随新消息</label></div><div id="scroll" tabindex="0" aria-label="调查会话历史"><button id="older" class="small" hidden>加载更早的消息</button><div id="content"></div></div><button id="latest" class="latest" hidden>回到最新消息 ↓</button><div class="note">思考仅展示 Claude 实际返回的内容；未返回的内容无法查看。</div></section>
<section class="detail" aria-label="证据详情"><div class="section-title detail-header">关联证据与报告<button id="close-detail" class="small" aria-label="关闭证据详情">关闭 ×</button></div><div id="detail"><div class="empty">选择卡片或任务<br><small>查看事件、前因后果与证据</small></div></div><div id="artifacts"></div></section></main><footer id="footer"></footer>
<dialog id="job-dialog" aria-labelledby="job-title">
<form id="job-form">
<div class="dialog-head"><h2 id="job-title">下发日志调查任务</h2><button type="button" id="close-job" aria-label="关闭">×</button></div>
<p class="form-hint">交给 Claude 主 Agent 完成日志分析、补证与报告。</p>
<label>所属项目<select id="job-project" required></select></label><label id="job-name-label">调查名称（可选）<input id="job-name" maxlength="120" placeholder="例如：生产环境日志复核"></label><label>任务方式<select id="job-mode"><option value="current">继续指定调查</option><option value="fresh">复用入库数据，重新独立分析</option><option value="new">分析新的日志目录</option></select></label>
<label id="job-case-label"><span id="job-case-title">继续哪次调查</span><select id="job-case"></select></label><p id="job-source-note" class="form-hint"></p><label id="log-dir-label" hidden>日志目录<input id="job-log-dir" placeholder="/绝对路径/日志目录" autocomplete="off"></label>
<label>背景与调查目标（可选）<textarea id="job-background" rows="5" maxlength="30000" placeholder="例如：生产和测试环境均出现异常，请定位攻击来源、时间和路径。留空则自主调查。"></textarea></label>
<div class="form-options"><label>模型预算（美元）<input id="job-budget" type="number" min="0.01" step="0.01" value="8" required></label><label id="analysis-only-label" class="check-label"><input id="job-analysis-only" type="checkbox" checked> 跳过数据初始化</label></div>
<p id="job-mode-note" class="form-hint">复用当前案件和已入库数据，在新 Claude 会话中继续。</p>
<p id="job-error" class="form-error" role="alert"></p>
<div class="dialog-actions"><button type="button" id="cancel-job" class="small">取消</button><button type="submit" id="submit-job" class="primary">启动调查</button></div>
</form></dialog>
<dialog id="workspace-dialog" class="workspace-dialog"><div class="dialog-head"><h2 id="workspace-title"></h2><button id="close-workspace" aria-label="关闭">×</button></div><p id="workspace-error" class="form-error" role="alert"></p><div id="workspace-content"></div></dialog>
<dialog id="name-dialog"><form id="name-form"><h2 id="name-title"></h2><label>名称<input id="workspace-name" maxlength="120" required></label><p id="name-error" class="form-error"></p><div class="dialog-actions"><button id="cancel-name" type="button" class="small">取消</button><button class="primary" type="submit">保存</button></div></form></dialog><dialog id="delete-dialog"><h2>移入回收站？</h2><p id="delete-note" class="form-hint"></p><div class="dialog-actions"><button id="cancel-delete" class="small">取消</button><button id="confirm-delete" class="primary">移入回收站</button></div></dialog></body></html>
