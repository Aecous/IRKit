[project]
name = "irkit-local"
version = "0.1.0"
description = "Local incident investigation tools for Claude Code native subagents"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2.1",
    "mcp>=1.20,<2",
    "typer>=0.16,<1",
    "evtx==0.15.0",
    "pytz>=2025.2",
    "markdown-it-py>=3,<5",
]

[project.scripts]
irkit = "irkit.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
